# Builds FFmpegKitNext for iOS (device arm64 + Apple silicon simulator) and publishes
# the xcframeworks with a local Package.swift as a GitHub release.
#
# Follows the upstream CI recipe (.github/workflows/ios-build-scripts.yml on the
# development branch of arthenica/ffmpeg-kit-next): Homebrew host tools, Xcode pinned
# explicitly instead of the image default, ios.sh run directly without Nix.

name: build ios

on:
  workflow_dispatch:
    inputs:
      ref:
        description: ffmpeg-kit-next tag or commit
        default: v9.0.0
      xcode:
        description: Xcode version installed on the runner image
        default: '26.6'
      ios-target:
        description: minimum iOS version of the libraries
        default: '15.0'
      extra-options:
        description: extra ios.sh options, e.g. --enable-lib-libwebp
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          repository: arthenica/ffmpeg-kit-next
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: host tools
        run: |
          brew install autoconf automake libtool pkg-config gettext \
            cmake bison meson ninja nasm yasm gperf ragel texinfo autogen \
            gtk-doc libtasn1 doxygen wget gnu-sed xz
          {
            echo "$(brew --prefix gettext)/bin"
            echo "$(brew --prefix bison)/bin"
            echo "$(brew --prefix texinfo)/bin"
          } >> "$GITHUB_PATH"
          {
            echo "ACLOCAL_PATH=$(brew --prefix gettext)/share/aclocal:$(brew --prefix)/share/aclocal"
            echo "SED=$(brew --prefix gnu-sed)/bin/gsed"
          } >> "$GITHUB_ENV"

      - name: select xcode
        env:
          XCODE: ${{ inputs.xcode }}
        run: |
          APP="/Applications/Xcode_${XCODE}.app"
          if [[ ! -d "$APP" ]]; then
            echo "Xcode ${XCODE} is not on this image. Available:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          echo "DEVELOPER_DIR=${APP}/Contents/Developer" >> "$GITHUB_ENV"
          # ios.sh sources this file, so the pin also holds inside the build scripts.
          echo "export DEVELOPER_DIR=${APP}/Contents/Developer" > ~/.xcode.for.ffmpeg.kit.sh

      - name: build
        env:
          EXTRA_OPTIONS: ${{ inputs.extra-options }}
          IOS_TARGET: ${{ inputs.ios-target }}
          # Homebrew ships CMake 4, which rejects soxr's cmake_minimum_required below 3.5.
          # Fixed upstream in scripts/apple/soxr.sh on the development branch, not yet in v9.0.0.
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'
        run: |
          xcodebuild -version
          ./ios.sh --xcframework --spm --target="${IOS_TARGET}" \
            --disable-arch-arm64e \
            --disable-arch-x86-64 \
            --disable-arch-arm64-mac-catalyst \
            --disable-arch-x86-64-mac-catalyst \
            --enable-lib-ios-audiotoolbox \
            --enable-lib-ios-videotoolbox \
            --enable-lib-ios-zlib \
            --enable-lib-ios-bzip2 \
            --enable-lib-ios-libiconv \
            --enable-lib-lame \
            --enable-lib-libilbc \
            --enable-lib-libvorbis \
            --enable-lib-opencore-amr \
            --enable-lib-opus \
            --enable-lib-shine \
            --enable-lib-soxr \
            --enable-lib-speex \
            --enable-lib-twolame \
            --enable-lib-vo-amrwbenc \
            ${EXTRA_OPTIONS}

      - name: failure logs
        if: failure()
        run: |
          tail -n 300 build.log
          if [[ -f src/ffmpeg/ffbuild/config.log ]]; then tail -n 50 src/ffmpeg/ffbuild/config.log; fi

      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
          XCODE: ${{ inputs.xcode }}
          IOS_TARGET: ${{ inputs.ios-target }}
          EXTRA_OPTIONS: ${{ inputs.extra-options }}
        run: |
          mv prebuilt/bundle-apple-xcframework-ios-* FFmpegKit
          zip -qry ffmpegkit-ios.zip FFmpegKit
          {
            echo "Source: https://github.com/arthenica/ffmpeg-kit-next/tree/$(git rev-parse HEAD)"
            echo
            echo "Xcode ${XCODE}, iOS ${IOS_TARGET}+, slices arm64 and arm64-simulator. Extra options: ${EXTRA_OPTIONS:-none}."
            echo
            echo "LGPL-3.0. FFmpeg and external library sources are fetched by the build scripts of that commit; license files are inside each xcframework."
          } > notes.md
          gh release create "${REF}-${GITHUB_RUN_NUMBER}" ffmpegkit-ios.zip build.log \
            --repo "$GITHUB_REPOSITORY" \
            --title "FFmpegKitNext ${REF} for iOS, run ${GITHUB_RUN_NUMBER}" \
            --notes-file notes.md
